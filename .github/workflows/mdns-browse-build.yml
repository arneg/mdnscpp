name: mdns-browse prebuilds

# Builds the mdns-browse native addon on every supported platform, smoke-tests
# the result and uploads one artifact per target. package-check then combines
# those into an unsigned npm tarball (mdns-browse-package-unsigned). Nothing
# here signs or publishes; the maintainer downloads that tarball and runs
# assemble.js --from-tarball --sign on a Mac.
#
# Tag runs (mdns-browse-vX.Y.Z) additionally attest build provenance.

on:
  pull_request:
    paths:
      - ".github/workflows/mdns-browse-build.yml"
      - "package.json"
      - "package-lock.json"
      - "mdns-browse/**"
      - "mdns-browse-build/**"
      - "src/**"
      - "include/**"
  push:
    # Path filters are not applied to tag pushes.
    # TEMPORARY: the CI bring-up branch is listed so that pushing it runs the
    # workflow without a pull request. Remove before merging.
    branches: [main, taskbranch/ci-prebuild]
    tags: ["mdns-browse-v*"]
    paths:
      - ".github/workflows/mdns-browse-build.yml"
      - "package.json"
      - "package-lock.json"
      - "mdns-browse/**"
      - "mdns-browse-build/**"
      - "src/**"
      - "include/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Node.js used to run the build tooling (the addon itself is built against
  # Node-API 9 and loads on every supported Node.js release, see compat jobs).
  BUILD_NODE_VERSION: "24"
  # The full mDNS test suite needs working multicast on the runner, which has
  # to be confirmed per platform. While "false", failures of the full suite
  # are reported as warnings only; the smoke test is always required. Flip to
  # "true" once the suite has been green on all platforms.
  FULL_TESTS_REQUIRED: "false"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # macOS and Windows: build natively on the matching runner.
  # ---------------------------------------------------------------------------
  build-native:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # build provenance attestation (tag runs only)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: darwin-arm64, runner: macos-latest }
          - { name: darwin-x64, runner: macos-15-intel }
          - { name: win32-x64, runner: windows-latest }
          - { name: win32-arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}

      - run: npm ci

      - name: Build prebuild
        run: npm run prebuildify -w mdns-browse-build

      # `strip` rewrites the binary; on arm64 macOS an invalid signature gets
      # the process killed on load, so make sure there is a valid ad-hoc one.
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          for f in mdns-browse-build/prebuilds/*/*.node; do
            if ! codesign --verify --strict "$f"; then
              echo "signature invalid after strip, re-applying ad-hoc signature"
              codesign --force --sign - "$f"
            fi
            codesign -dv "$f" 2>&1 | grep -E 'Signature|flags' || true
          done

      - run: ls -lR mdns-browse-build/prebuilds

      - name: Smoke test
        run: |
          npm run link-local -w mdns-browse-build
          npm run smoke -w mdns-browse-build

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/mdns-browse-v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: mdns-browse-build/prebuilds/**/*.node

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.name }}
          path: mdns-browse-build/prebuilds
          if-no-files-found: error

      # Use test:prebuilt: `npm test` would rebuild, dropping the ad-hoc
      # signature applied above. The prebuild is already linked for smoke.
      - name: Full test suite
        continue-on-error: ${{ env.FULL_TESTS_REQUIRED != 'true' }}
        run: npm run test:prebuilt -w mdns-browse-build

  # ---------------------------------------------------------------------------
  # Linux: build inside containers so the glibc baseline is controlled (glibc
  # 2.28, matching the oldest glibc Node.js itself supports) and so that musl
  # (Alpine) gets its own binary. A plain `docker run` after a host-side
  # checkout is used on purpose: JavaScript actions are unreliable inside old
  # glibc and Alpine images.
  # ---------------------------------------------------------------------------
  build-linux:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-glibc
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            libc: glibc
          - name: linux-arm64-glibc
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            libc: glibc
          - name: linux-x64-musl
            runner: ubuntu-latest
            image: node:24-alpine
            libc: musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            image: node:24-alpine
            libc: musl
    steps:
      - uses: actions/checkout@v7

      # Provides the Node.js that is mounted into the glibc container.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}

      - name: Build and smoke test in container
        run: |
          mounts=""
          if [ "${{ matrix.libc }}" = glibc ]; then
            node_root="$(dirname "$(dirname "$(command -v node)")")"
            mounts="-v $node_root:/opt/hostnode:ro"
          fi
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            $mounts \
            "${{ matrix.image }}" \
            sh /work/mdns-browse-build/scripts/ci/build-linux.sh

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/mdns-browse-v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: mdns-browse-build/prebuilds/**/*.node

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.name }}
          path: mdns-browse-build/prebuilds
          if-no-files-found: error

      # The glibc binary runs on the (newer) host, which has a real Avahi
      # daemon available for the full suite.
      - name: Install Avahi
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y avahi-daemon libavahi-client3
          sudo systemctl start avahi-daemon || true
          systemctl is-active avahi-daemon || true

      # Use test:prebuilt: `npm test` would rebuild on the host and replace
      # the manylinux binary the container just produced and linked.
      - name: Full test suite
        if: matrix.libc == 'glibc'
        continue-on-error: ${{ env.FULL_TESTS_REQUIRED != 'true' }}
        run: npm run test:prebuilt -w mdns-browse-build

  # ---------------------------------------------------------------------------
  # The addon is Node-API, so one binary must load on every supported Node.js.
  # The build jobs cover Node 24; check the other supported majors here.
  # ---------------------------------------------------------------------------
  compat:
    name: load on node ${{ matrix.node }} (${{ matrix.target }})
    needs: [build-native, build-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Cross product of node x target; `include` only attaches the runner
        # to the combinations of the matching target.
        node: ["22", "26"]
        target:
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - win32-arm64
          - linux-x64-glibc
          - linux-arm64-glibc
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: win32-x64, runner: windows-latest }
          - { target: win32-arm64, runner: windows-11-arm }
          - { target: linux-x64-glibc, runner: ubuntu-latest }
          - { target: linux-arm64-glibc, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: prebuild-${{ matrix.target }}
          path: mdns-browse/prebuilds

      - name: Install Avahi client library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-client3

      - run: npm run smoke -w mdns-browse-build

  compat-alpine:
    name: load on node ${{ matrix.node }} (${{ matrix.target }})
    needs: [build-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
        target: [linux-x64-musl, linux-arm64-musl]
        include:
          - { target: linux-x64-musl, runner: ubuntu-latest }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: prebuild-${{ matrix.target }}
          path: mdns-browse/prebuilds

      - name: Smoke test in Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "node:${{ matrix.node }}-alpine" \
            sh -c 'apk add --no-cache avahi-libs && npm ci --ignore-scripts && npm run smoke -w mdns-browse-build'

  # ---------------------------------------------------------------------------
  # Combine the per-target artifacts into the unsigned npm tarball the
  # maintainer will download, sign, and publish. Do not publish this artifact
  # as-is: darwin binaries are only ad-hoc signed.
  # ---------------------------------------------------------------------------
  package-check:
    name: assemble and check package
    needs: [build-native, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}

      - run: npm ci --ignore-scripts

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/mdns-browse-v')
        run: |
          tag_version="${GITHUB_REF#refs/tags/mdns-browse-v}"
          pkg_version="$(node -p "require('./mdns-browse/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag version $tag_version != mdns-browse/package.json version $pkg_version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: mdns-browse-build/dist/from-ci

      - name: Install Avahi client library
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-client3

      - name: Assemble package
        run: |
          tag_args=()
          if [[ "${GITHUB_REF}" == refs/tags/mdns-browse-v* ]]; then
            tag_args=(--tag "${GITHUB_REF_NAME}")
          fi
          npm run assemble -w mdns-browse-build -- \
            --from-dir dist/from-ci \
            "${tag_args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: mdns-browse-package-unsigned
          path: mdns-browse-build/dist/*.tgz
          if-no-files-found: error
